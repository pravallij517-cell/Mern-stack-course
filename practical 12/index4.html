<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="box">
            <div class="blue ScaleX">
                ScaleX
             </div>
        </div>
        <div class="box">
            <div class="blue ScaleY">
                ScaleY
            </div>
        </div>
     <div class="box">
            <div class="blue Scale">
                Scale
            </div>
        </div>
        <div class="box">
            <div class="blue TranslateX">
                TranslateX
            </div>
        </div>
         <div class="box">
            <div class="blue TranslateY">
                TranslateY
            </div>
        </div>
         <div class="box">
            <div class="blue Translate">
                Translate
            </div>
            </div>
             <div class="box">
            <div class="blue Matrix">
                Matrix
            </div>
        </div>
         <div class="box">
            <div class="blue rotate">
                Rotate
            </div>
        </div>
         <div class="box">
            <div class="blue Skew">
                Skew
            </div>
        </div>
         <div class="box">
            <div class="blue SkewX">
                SkewX
            </div>
        </div>

         <div class="box">
            <div class="blue SkewY">
                SkewY
            </div>
        </div>

         <div class="box">
            <div class="blue MatriX3d">
                MatriX3d
            </div>
        </div>
         <div class="box">
            <div class="blue Translate3D">
                Translate3D
            </div>
        </div>
         <div class="box">
            <div class="blue RotateX">
                RotateX
            </div>
        </div>
         <div class="box">
            <div class="blue RotateY">
                RotateY
            </div>
        </div>
         <div class="box">
            <div class="blue TranslateZ">
                TranslateZ
            </div>
        </div>
    </div>
</body>
</html>
