<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box Model</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        .box{
            background-color:rgb(22, 195, 218)
        }
        .box1{
            color:rgba(190, 15, 53, 0.897);
            padding:10px;
            margin:35px;
            border:2px solid blue;
            height:200px;
            box-sizing:border-box;
        }
        .box2{
            color:rgb(122, 20, 218);
            padding:20px;
            margin:36px;
            border:20px solid rgb(94, 3, 155);
            height:200px;
            box-sizing:border-box;
            width: 200;
        }
    </style>
</head>
<body>
    <div class="box1 box">
        I am a box
    </div>
    <div class="box2 box">
         I am another box
    </div>

</body>
</html>
