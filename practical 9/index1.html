<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow and Text shadow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border:2px solid black;
            padding:34px;
            box-shadow: 5px 15px 5px red;
            margin-bottom: 20px;

        }
        .box2{
            border: 2px solid black;
            padding:34px;
            box-shadow: 5px 15px 5px green;
        }
        .text-shadow{
            text-shadow: 5px 15px 5px blue;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box.
    </div>
    <div class="box2">
       I am another box 
    </div>
    <p class="text-shadow">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quo, tenetur!</p>

</body>
</html>
